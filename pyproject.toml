[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tablerag"
version = "0.2.0"
description = "Table-aware RAG for technical documents: lossless table ingestion, exact answers and a benchmark against common approaches."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<0.12",
    "reportlab>=4.2,<6",  # renders the benchmark PDFs
]

[project.scripts]
tablerag = "tablerag.cli:main"

[project.optional-dependencies]
# Dense retrieval and the language-model reader (the GPU run on Colab)
gpu = ["sentence-transformers>=3", "transformers>=4.44", "accelerate>=0.33", "datasets>=2.20"]
# Other ingestion methods compared in the benchmark
baselines = ["camelot-py>=1.0", "docling>=2.40"]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tablerag*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tablerag"]
branch = true
omit = ["*/docling_ingest.py", "*/camelot_ingest.py"]  # need optional packages; run on Colab

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["class HFReader", "class Dense", "def load_t2"]
