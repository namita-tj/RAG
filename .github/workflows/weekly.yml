name: Weekly dependency check

# PDF libraries change how they read pages between releases. Every Monday this runs the tests,
# the CPU benchmark and the benchmark gate against the newest versions the project allows, so a
# change upstream shows up here before anyone installs it. A second job tries the newest
# versions without the upper limits in pyproject.toml, to see early whether the next major
# release would break anything (it reports, but doesn't fail the workflow).

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allowed:
    name: Newest allowed versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Install the newest allowed versions
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[dev]"
      - name: Versions in use
        run: |
          {
            echo "### Versions in use"
            echo '```'
            pip list --format=freeze | grep -iE '^(pdfplumber|pdfminer|pypdfium2|reportlab|pillow)=='
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        run: pytest -q
      - name: CPU benchmark
        run: python -m tablerag.bench.run --methods naive markdown ours --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/results"
      - name: Benchmark gate
        run: python -m tablerag.bench.gate --baseline results/cpu/results.json --current "$RUNNER_TEMP/results/results.json"

  next-major:
    name: Newest versions, ignoring upper limits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Install without upper limits
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install --upgrade pdfplumber reportlab pytest pytest-cov ruff numpy
          pip list --format=freeze | grep -iE '^(pdfplumber|pdfminer|reportlab)==' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        run: pytest -q
      - name: CPU benchmark and gate
        run: |
          python -m tablerag.bench.run --methods naive markdown ours --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/results"
          python -m tablerag.bench.gate --baseline results/cpu/results.json --current "$RUNNER_TEMP/results/results.json"
