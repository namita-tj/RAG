name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # DejaVu has the check-mark glyph used by one of the benchmark table layouts.
      - name: Install fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests with coverage gate
        run: pytest --cov --cov-report=term --cov-fail-under=85
      - name: CPU benchmark (ingestion, BM25 retrieval, exact path)
        run: python -m tablerag.bench.run --methods naive markdown ours --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/results"
      # Fails the run if any metric of our method is worse than the committed baseline in results/cpu/,
      # and writes the comparison table to the run's summary page.
      - name: Benchmark gate
        run: python -m tablerag.bench.gate --baseline results/cpu/results.json --current "$RUNNER_TEMP/results/results.json"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
