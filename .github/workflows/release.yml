name: Release

# Push a version tag to release:  git tag v0.2.0 && git push origin v0.2.0
# The tag must match the version in pyproject.toml. Then this workflow
#   1. runs the tests, the CPU benchmark and the benchmark gate,
#   2. builds the Python package (wheel and source),
#   3. creates a GitHub Release with the package and the benchmark summaries attached,
#   4. pushes a Docker image of the tablerag command to GitHub Container Registry,
#   5. publishes to PyPI, only if the repository variable PUBLISH_TO_PYPI is "true"
#      (needs a trusted publisher set up on pypi.org first, so no token is stored anywhere).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tests, benchmark and gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1
          fi
      - run: pytest -q
      - name: CPU benchmark and gate
        run: |
          python -m tablerag.bench.run --methods naive markdown ours --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/results"
          python -m tablerag.bench.gate --baseline results/cpu/results.json --current "$RUNNER_TEMP/results/results.json"

  build:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp results/cpu/summary.md benchmark-cpu.md
          cp results/gpu/summary.md benchmark-gpu.md
          gh release create "$GITHUB_REF_NAME" dist/* benchmark-cpu.md benchmark-gpu.md \
            --title "tablerag $GITHUB_REF_NAME" --generate-notes

  docker:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this run's identity instead of a password
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
